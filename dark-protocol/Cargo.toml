[workspace]
members = [
    "programs/dark-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dark-protocol/dark-protocol"

# Dependency set adopted wholesale from the Dark DeFi rewrite
# (TRANSPLANT-SPEC W1): the rewrite's resolved Anchor 0.32.1 set replaces
# the former anchor-lang 1.0.2 / solana-program 4.0 block and the Jupiter
# path dependencies, which are deleted.
[workspace.dependencies]
anchor-lang = "0.32.1"
groth16-solana = "0.2.0"
light-poseidon = "0.2.0"
ark-bn254 = "0.4.0"
ark-ff = "0.4.2"
ark-ec = "0.4.0"
ark-serialize = "0.4.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
opt-level = 2
