[package]
name = "dark-protocol"
version = "0.1.0"
edition = "2021"
description = "Dark Protocol — Groth16-verified shielded SOL pool (BN254/Poseidon). Surviving core transplanted from the Dark DeFi rewrite crate `dark-protocol-v2` per TRANSPLANT-SPEC W1/W2; internal logic unchanged from the donor."

[lib]
crate-type = ["cdylib", "lib"]
name = "dark_protocol"

[features]
default = []
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]
cpi = ["no-entrypoint"]
# === Certora CVLR ===
# The `certora` feature pulls in the CVLR spec crates and compiles
# src/certora/ (rules + harnesses). It implies `no-entrypoint` and is
# never enabled for production builds, so the deployed .so is
# unchanged (hash-checked in src/certora/RESULTS.md).
certora = ["no-entrypoint", "dep:cvlr", "dep:cvlr-solana"]

[dependencies]
anchor-lang = "0.32.1"
groth16-solana = "0.2.0"
light-poseidon = "0.2.0"
ark-bn254 = "0.4.0"
ark-ff = "0.4.2"
ark-ec = "0.4.0"
ark-serialize = "0.4.2"
solana-poseidon = "2.3.13"
cvlr = { version = "0.6", optional = true }
cvlr-solana = { version = "0.5", optional = true }

[package.metadata.certora]
sources = ["src/**/*.rs"]
solana_inlining = ["src/certora/envs/cvlr_inlining.txt"]
solana_summaries = ["src/certora/envs/cvlr_summaries.txt"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
