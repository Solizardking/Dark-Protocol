{
    // Certora Solana Prover — full spec suite for dark-protocol.
    // Run from the program crate root
    // (dark-protocol/programs/dark-protocol):
    //   certoraSolanaProver src/certora/confs/run.conf
    // Sources mode: the Prover builds via `cargo certora-sbf` and reads
    // sources / solana_inlining / solana_summaries from
    // [package.metadata.certora] in the crate's Cargo.toml. The
    // `certora` feature is enabled automatically by the build.
    //
    // This runs every rule in the PROVEN-INTENT set (properties 0–6 of
    // dark-protocol/aristotle/dark-protocol_spec.md). The one
    // deliberate exclusion is rule_p5_progress_under_oracle_contract:
    // it is A3-conditional (it needs an A3-faithful summary of
    // Groth16Verifier::verify) and appears in NO conf — see
    // specs/p5_progress.rs and SURVEY.md.
    "msg": "dark-protocol: properties 0-6 (no-UB, conservation, withdraw gating, deposit binding, authority impotence, error classification, root/ring integrity)",
    "loop_iter": 1,
    "optimistic_loop": false,
    "smt_timeout": 6000,
    // Solana platform-tools version used for the cloud build. v1.53 is
    // the latest Certora-published platform-tools (the local v1.58 set
    // was never published to Certora's registry); it is installed
    // locally and the local gate uses it via the same override. If the
    // cloud cannot build this Anchor workspace with v1.53, use the
    // pre-built mode instead: src/certora/confs/prebuilt.conf verifies
    // the locally built .so (sha256 recorded in RESULTS.md).
    "cargo_tools_version": "v1.53",
    // Vacuity checks on every rule (recommended by Certora
    // methodology): a rule that passes only because its scenario is
    // unreachable is flagged instead of silently "verified".
    "rule_sanity": "basic"
}
